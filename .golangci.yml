version: "2"
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - lll
    - misspell
    - unused
  settings:
    lll:
      line-length: 120
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # golines aligns struct tags past the cap; tag lines cannot be wrapped.
      - linters:
          - lll
        source: '`[a-z_]+:"'
      # Test-suite mock fields and constructors: generated mock type names make the lines unwrappable.
      - linters:
          - lll
        source: '[a-z_]+_mocks\.(NewMock|Mock)'
      # Func-literal signatures (e.g. gomock DoAndReturn callbacks): golines cannot wrap them (golangci/golines lacks support, see segmentio/golines#145).
      - linters:
          - lll
        source: \bfunc\(.*\{$
    paths:
      - tests/.*_mocks
      - src/.*_host/docs
      - .*/abi
formatters:
  enable:
    - golines
  settings:
    golines:
      max-len: 120
