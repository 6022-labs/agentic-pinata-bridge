server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# metrics_generator derives RED span metrics + service graphs from spans and
# remote-writes them to Mimir, so Grafana can dashboard trace aggregates.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://pinata-bridge-mimir:9009/api/v1/push
        send_exemplars: true
  processor:
    # Promote these resource attributes to span-metric labels so dashboards can filter by them.
    span_metrics:
      dimensions:
        - deployment.environment.name
        - service.namespace
        - agent.node.id
        - agent.ens.domain
        - service.instance.id

# Enables the generator processors per-tenant.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
