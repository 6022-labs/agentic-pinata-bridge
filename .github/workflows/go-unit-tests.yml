name: Go Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-unit-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-unit-tests.yml"

concurrency:
  group: go-unit-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: false

      - name: Restore Go modules and build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Run tests
        run: go test $(go list ./tests/... | grep '_unit_tests')
