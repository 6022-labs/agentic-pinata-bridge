name: Release Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agentic-pinata-bridge
            dockerfile: src/pinata_bridge_host/Dockerfile
            context: .
          - image: agentic-pinata-bridge-grafana
            dockerfile: grafana/Dockerfile
            context: grafana
          - image: agentic-pinata-bridge-alloy
            dockerfile: grafana/alloy/Dockerfile
            context: grafana/alloy
          - image: agentic-pinata-bridge-loki
            dockerfile: grafana/loki/Dockerfile
            context: grafana/loki
          - image: agentic-pinata-bridge-mimir
            dockerfile: grafana/mimir/Dockerfile
            context: grafana/mimir
          - image: agentic-pinata-bridge-tempo
            dockerfile: grafana/tempo/Dockerfile
            context: grafana/tempo

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Write digest to summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "- Digest: \`${IMAGE}@${DIGEST}\`"
            echo "- Tags:"
            echo "${TAGS}" | sed 's/^/  - `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
